name: APK ve eklenti

on:
  push:
    paths:
      - 'android/**'
      - 'extension/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Testler ve APK
        working-directory: android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Dosyaları hazırla
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/ReelsSayaci.apk
          (cd extension && zip -r ../dist/ReelsSayaci-eklenti.zip . -x '*.DS_Store')

      - uses: actions/upload-artifact@v4
        with:
          name: ReelsSayaci
          path: dist/*

      - name: Sürüm yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Reels Sayacı 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            dist/ReelsSayaci.apk
            dist/ReelsSayaci-eklenti.zip
          body: |
            **Telefon (Android):** `ReelsSayaci.apk` dosyasını indirip kur.
            **Bilgisayar (Chrome / Edge / Brave):** `ReelsSayaci-eklenti.zip` dosyasını indirip klasöre çıkar, `chrome://extensions` sayfasında "Paketlenmemiş öğe yükle" ile seç.

            Kurulum adımları: README.
